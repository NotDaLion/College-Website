<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — La Cucina Del Mare</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../Stylesheets/Menu.css" />
    <link rel="stylesheet" href="../Stylesheets/login.css" />
  </head>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get("registered") === "1") {
      const msg = document.getElementById("register-success");
      if (msg) msg.style.display = "block";
    }
  </script>

  <body>
    <!-- Header -->
    <header class="alt-header" role="banner">
      <div class="alt-container">
        <a
          class="alt-logo"
          href="../Pages/index.html"
          aria-label="La Cucina Del Mare homepage"
          >La Cucina Del Mare</a
        >
        <nav class="alt-nav" role="navigation" aria-label="Main navigation">
          <ul>
            <li><a href="../Pages/index.html">Home</a></li>
            <li><a href="../Pages/Menu.html">Menu</a></li>
            <li><a href="../Pages/about-alt.html">About</a></li>
            <li><a href="../Pages/contact.html">Contact</a></li>
            <li><a href="../Pages/cart.php">Cart</a></li>
            <li><a href="../Pages/account.php">Account</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Main -->
    <main class="login-page">
      <div class="login-card">
        <h2>Welcome Back</h2>
        <p class="login-sub">Login to your account</p>
        <div id="register-success" class="login-success" style="display: none">
          Account created successfully. Please log in.
        </div>

        <form method="post" action="../Backend/login.php" class="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              name="email"
              class="form-control"
              required
              placeholder="you@example.com"
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              name="password"
              class="form-control"
              required
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="login-btn w-100">Login</button>

          <p class="login-footer text-center mt-3">
            Don’t have an account?
            <a href="../Pages/register.html">Create one</a>
          </p>
        </form>
      </div>
    </main>

    <!-- Footer -->
    <footer class="alt-footer">
      <div class="alt-container">
        <p>© <span id="alt-year"></span> La Cucina Del Mare</p>
      </div>
    </footer>

    <script>
      document.getElementById("alt-year").textContent =
        new Date().getFullYear();
    </script>
  </body>
</html>
